services:
  # LLM inference runs on a RunPod instance via vLLM (OpenAI-compatible API on port 8000).
  # Setup (one-time): run scripts/runpod-tunnel.sh to start vLLM and open the SSH tunnel.

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mintify-qdrant
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "6333:6333"   # REST API + dashboard
      - "6334:6334"   # gRPC
    restart: unless-stopped

  # Self-hosted metasearch engine for OWUI's web search. Replaces DuckDuckGo,
  # whose free scraping endpoint rate-limits server IPs (202 Ratelimit). SearXNG
  # aggregates many engines and is reachable in-network at http://searxng:8080.
  # Config (JSON output + limiter off) lives in ./searxng/settings.yml.
  searxng:
    image: searxng/searxng:latest
    container_name: mintify-searxng
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    # Uncomment to reach the SearXNG UI from the host for debugging:
    # ports:
    #   - "8081:8080"
    restart: unless-stopped

  mintify-rag-service:
    build:
      context: ./rag-backend
      dockerfile: Dockerfile
    container_name: mintify-rag-service
    depends_on:
      qdrant:
        condition: service_started
      searxng:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - QDRANT_URL=http://qdrant:6333
      - VLLM_BASE_URLS=${VLLM_BASE_URLS:-http://host.docker.internal:8002}
      - TTS_URL=${TTS_URL:-http://host.docker.internal:8006}
      # OWUI is the single source of extracted document text. The indexer pulls
      # a file's content from OWUI's API (by id) and embeds it into Qdrant.
      - OWUI_BASE_URL=http://open-webui:8080
      # Create an admin API key in OWUI (Settings → Account → API Keys) and set
      # it here (e.g. via .env) so the indexer can read file content.
      - OWUI_API_KEY=${OWUI_API_KEY:-}
      # Backend-owned web search: the rag-backend queries SearXNG and extracts
      # page content with trafilatura when the user enables 🌐 (see web_search.py).
      - SEARXNG_URL=http://searxng:8080
      # Personal-docs text extraction uses the SAME docling-serve instance as
      # OWUI's knowledge-base uploads (RunPod, SSH tunnel on host port 5001).
      - DOCLING_SERVER_URL=${DOCLING_SERVER_URL:-http://host.docker.internal:5001}
    volumes:
      # Document text now comes from OWUI's API (by file id), not from disk —
      # no uploads mount needed.
      - ./rag-backend/app:/app/app
      # Per-user personal files (sidebar drag & drop): SQLite DB + raw files.
      - ./data/personal_docs:/data/personal_docs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8088:8080"   # optional: exposed for local debugging --> EXTRA it was 8080:8080 but changed for server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # allow time for embedding model load
    restart: unless-stopped

  pipelines:
    build:
      context: ./pipelines
      dockerfile: Dockerfile
    container_name: mintify-pipelines
    depends_on:
      mintify-rag-service:
        condition: service_healthy
    environment:
      - PIPELINES_API_KEY=mintify-pipeline-key
      - RAG_BACKEND_URL=http://mintify-rag-service:8080
      - PIPELINES_DIR=/app/pipelines
      # FIX: Python buffers stdout when not attached to a TTY (i.e. inside Docker).
      # Without this, print() calls never flush to `docker logs` — the primary reason
      # no pipeline logs were visible even when pipe() was being called.
      - PYTHONUNBUFFERED=1
    volumes:
      - ./pipelines:/app/pipelines
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9099:9099"
    restart: unless-stopped

  open-webui:
    build:
      context: ./open-webui-src
      dockerfile: Dockerfile
    container_name: mintify-webui
    depends_on:
      - pipelines
      - qdrant
      - searxng
    environment:
      - OLLAMA_BASE_URL=                        # disabled — all chat goes through pipeline
      - OPENAI_API_BASE_URL=http://pipelines:9099
      - OPENAI_API_KEY=mintify-pipeline-key
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - DEFAULT_LOCALE=de
      - WEBUI_NAME=MINTIFY
      - ENABLE_COMMUNITY_SHARING=false
      # We do our own RAG in the rag-backend. Disable OWUI's built-in retrieval pieces
      # so the user message arrives at the pipeline without the "### Task: Respond..."
      # template and <source>-injected chunks. Query Generation (which expands the user
      # question into search queries for OWUI's RAG) is toggled in Admin → Settings → Interface.
      - ENABLE_RAG_HYBRID_SEARCH=false
      - RAG_TEMPLATE=
      # Stop OWUI embedding files into its own Chroma DB. Text is still extracted
      # into the SQL `file` table (the rag-backend pulls it from there via the API).
      - BYPASS_EMBEDDING_AND_RETRIEVAL=true
      # On upload / content-update / delete, OWUI notifies the rag-backend to
      # (re)index or drop the file's vectors in Qdrant (see routers/files.py).
      - RAG_INGEST_WEBHOOK_URL=http://mintify-rag-service:8080/api/index
      # --- Web search (backend-owned) ---
      # ENABLE_WEB_SEARCH keeps the 🌐 toggle visible and lets the web_search flag
      # flow to the pipeline (PersistentConfig — also enable it in Admin → Settings
      # → Web Search on an existing DB, since the DB value wins there).
      - ENABLE_WEB_SEARCH=true
      # MINTIFY: skip OWUI's OWN fetch+inject (it returns boilerplate-heavy page
      # dumps and would double-fetch). The rag-backend does SearXNG + trafilatura
      # instead. Read directly by utils/middleware.py (plain env var, not config).
      - MINTIFY_BACKEND_WEB_SEARCH=true
      # TTS: Qwen3-TTS via rag-backend proxy → vLLM-Omni on RunPod (tunnel port 8006)
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://mintify-rag-service:8080/api
      - AUDIO_TTS_OPENAI_API_KEY=mintify-pipeline-key
      - AUDIO_TTS_MODEL=qwen3-tts
      - AUDIO_TTS_VOICE=de-DE
      - CONTENT_EXTRACTION_ENGINE=docling
      - DOCLING_SERVER_URL=http://host.docker.internal:5001
      - USER_PERMISSIONS_CHAT_CONTROLS=False
    volumes:
      - ./data/open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:8080"
    restart: unless-stopped

volumes: {}

networks:
  default:
    ipam:
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1
