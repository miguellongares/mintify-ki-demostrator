services:
  # LLM inference runs on a RunPod instance via vLLM (OpenAI-compatible API on port 8000).
  # Setup (one-time): run scripts/runpod-tunnel.sh to start vLLM and open the SSH tunnel.

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mintify-qdrant
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "6333:6333"   # REST API + dashboard
      - "6334:6334"   # gRPC
    restart: unless-stopped

  mintify-rag-service:
    build:
      context: ./rag-backend
      dockerfile: Dockerfile
    container_name: mintify-rag-service
    depends_on:
      qdrant:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - QDRANT_URL=http://qdrant:6333
      - VLLM_BASE_URLS=${VLLM_BASE_URLS:-http://host.docker.internal:8002}
      - UPLOAD_DIR=/app/uploads
      - TTS_URL=${TTS_URL:-http://host.docker.internal:8006}
    volumes:
      - ./data/open-webui/uploads:/app/uploads  #look at the uploaded docs form the web ui knowledge
      - ./rag-backend/app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8088:8080"   # optional: exposed for local debugging --> EXTRA it was 8080:8080 but changed for server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # allow time for embedding model load + PDF indexing
    restart: unless-stopped

  pipelines:
    build:
      context: ./pipelines
      dockerfile: Dockerfile
    container_name: mintify-pipelines
    depends_on:
      mintify-rag-service:
        condition: service_healthy
    environment:
      - PIPELINES_API_KEY=mintify-pipeline-key
      - RAG_BACKEND_URL=http://mintify-rag-service:8080
      - PIPELINES_DIR=/app/pipelines
      # FIX: Python buffers stdout when not attached to a TTY (i.e. inside Docker).
      # Without this, print() calls never flush to `docker logs` — the primary reason
      # no pipeline logs were visible even when pipe() was being called.
      - PYTHONUNBUFFERED=1
    volumes:
      - ./pipelines:/app/pipelines
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9099:9099"
    restart: unless-stopped

  open-webui:
    build:
      context: ./open-webui-src
      dockerfile: Dockerfile
    container_name: mintify-webui
    depends_on:
      - pipelines
      - qdrant
    environment:
      - OLLAMA_BASE_URL=                        # disabled — all chat goes through pipeline
      - OPENAI_API_BASE_URL=http://pipelines:9099
      - OPENAI_API_KEY=mintify-pipeline-key
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - DEFAULT_LOCALE=de
      - WEBUI_NAME=MINTIFY
      - ENABLE_COMMUNITY_SHARING=false
      # We do our own RAG in the rag-backend. Disable OWUI's built-in retrieval pieces
      # so the user message arrives at the pipeline without the "### Task: Respond..."
      # template and <source>-injected chunks. Query Generation (which expands the user
      # question into search queries for OWUI's RAG) is toggled in Admin → Settings → Interface.
      - ENABLE_RAG_HYBRID_SEARCH=false
      - RAG_TEMPLATE=
      # TTS: Qwen3-TTS via rag-backend proxy → vLLM-Omni on RunPod (tunnel port 8006)
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://mintify-rag-service:8080/api
      - AUDIO_TTS_OPENAI_API_KEY=mintify-pipeline-key
      - AUDIO_TTS_MODEL=qwen3-tts
      - AUDIO_TTS_VOICE=de-DE
    volumes:
      - ./data/open-webui:/app/backend/data
    ports:
      - "3000:8080"
    restart: unless-stopped

volumes: {}

networks:
  default:
    ipam:
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1
